<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Zayd Touhami Chahdi</title>
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>

  <main>
    <h1>Contact me</h1>

    <form action="https://oim.zhili.dev/echo/view" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" minlength="2" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" minlength="10" required></textarea>

      <button type="submit">Send</button>
    </form>
  </main>

</body>
</html>

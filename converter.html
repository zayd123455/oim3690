<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .app {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #2b7a4b;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #22603b;
    }

    #result {
      margin-bottom: 0;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Temperature Converter</h1>

    <label for="celsius">Celsius</label>
    <input type="number" id="celsius" placeholder="e.g. 100">

    <label for="fahrenheit">Fahrenheit</label>
    <input type="number" id="fahrenheit" placeholder="e.g. 212">

    <button type="button" id="convert-btn">Convert</button>
    <p id="result"></p>
  </main>

  <script>
    const celsiusInput = document.getElementById('celsius');
    const fahrenheitInput = document.getElementById('fahrenheit');
    const convertBtn = document.getElementById('convert-btn');
    const result = document.getElementById('result');

    function toFahrenheit(celsius) {
      return celsius * 9 / 5 + 32;
    }

    function toCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5 / 9;
    }

    // Round to one decimal so 37.77777 shows as 37.8
    function round(value) {
      return Math.round(value * 10) / 10;
    }

    convertBtn.addEventListener('click', () => {
      if (celsiusInput.value === '') {
        result.textContent = 'Type a temperature in Celsius first.';
        return;
      }
      const celsius = Number(celsiusInput.value);
      const fahrenheit = round(toFahrenheit(celsius));
      fahrenheitInput.value = fahrenheit;
      result.textContent = `${celsius}°C = ${fahrenheit}°F`;
    });

    // Type in either box and the other one updates
    celsiusInput.addEventListener('input', () => {
      if (celsiusInput.value === '') {
        fahrenheitInput.value = '';
        result.textContent = '';
        return;
      }
      const celsius = Number(celsiusInput.value);
      fahrenheitInput.value = round(toFahrenheit(celsius));
      result.textContent = `${celsius}°C = ${fahrenheitInput.value}°F`;
    });

    fahrenheitInput.addEventListener('input', () => {
      if (fahrenheitInput.value === '') {
        celsiusInput.value = '';
        result.textContent = '';
        return;
      }
      const fahrenheit = Number(fahrenheitInput.value);
      celsiusInput.value = round(toCelsius(fahrenheit));
      result.textContent = `${celsiusInput.value}°C = ${fahrenheit}°F`;
    });
  </script>
</body>
</html>
